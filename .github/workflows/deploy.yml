name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ────────────────────────────────────────────
# VULNERABLE: 시크릿 평문 노출 (Code Security 탐지 대상)
# ────────────────────────────────────────────
env:
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_BASE_URL: ${{ secrets.CORTEX_API_BASE_URL }}
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # ────────────────────────────────────────
  # Job 1: Cortex Code Security Scan (CLI)
  # ────────────────────────────────────────
  code-scan:
    name: Cortex Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Setup Cortex CLI
        run: |
          # Cortex CLI 다운로드 (Linux amd64)
          # Note: 실제 URL은 테넌트 환경에 따라 다를 수 있으나, 표준 API 엔드포인트를 사용합니다.
          curl -L "${{ env.CORTEX_API_BASE_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
          -H "x-xdr-auth-id: ${{ env.CORTEX_API_KEY_ID }}" \
          -o cortexcli.tar.gz
          tar -xzf cortexcli.tar.gz
          chmod +x ./cortexcli

      - name: Run Cortex Code Scan
        run: |
          ./cortexcli --api-base-url ${{ env.CORTEX_API_BASE_URL }} \
                      --api-key ${{ env.CORTEX_API_KEY }} \
                      --api-key-id ${{ env.CORTEX_API_KEY_ID }} \
                      code scan --directory . --upload-mode upload --soft-fail true

      - name: Run Cortex IaC Scan (Terraform)
        run: |
          ./cortexcli --api-base-url ${{ env.CORTEX_API_BASE_URL }} \
                      --api-key ${{ env.CORTEX_API_KEY }} \
                      --api-key-id ${{ env.CORTEX_API_KEY_ID }} \
                      iac scan --directory terraform/ --upload-mode upload --soft-fail true

  # ────────────────────────────────────────
  # Job 2: 앱 빌드 및 테스트
  # ────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: code-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short || echo "Tests completed (some may fail intentionally)"

  # ────────────────────────────────────────
  # Job 3: EC2 배포
  # ────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH로 EC2에 직접 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e

            # 앱 디렉토리 준비
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            # Git pull (이미 클론된 경우)
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            # Python 의존성 설치
            pip3 install -r app/requirements.txt

            # 환경변수 파일 생성
            cat > /home/ubuntu/app/.env << 'ENV'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=testdb
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            ENV

            # 기존 프로세스 종료 후 재시작
            pkill -f "uvicorn app.main" || true
            sleep 2

            # Uvicorn으로 앱 실행 (백그라운드)
            nohup uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              --workers 2 \
              >> /home/ubuntu/app/app.log 2>&1 &

            echo "✅ 배포 완료 — PID: $!"

      # Nginx 설정 업데이트
      - name: Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo tee /etc/nginx/sites-available/cortex-test << 'NGINX'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            NGINX

            sudo ln -sf /etc/nginx/sites-available/cortex-test \
                        /etc/nginx/sites-enabled/cortex-test
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx 설정 완료"

  # ────────────────────────────────────────
  # Job 4: 배포 후 헬스체크
  # ────────────────────────────────────────
  healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for app startup
        run: sleep 15

      - name: Health check
        run: |
          EC2_HOST="${{ secrets.EC2_HOST }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ 헬스체크 통과 (HTTP $RESPONSE)"
          else
            echo "⚠️  헬스체크 응답: HTTP $RESPONSE (앱이 아직 시작 중일 수 있음)"
          fi

      - name: Verify vulnerable endpoints exist
        run: |
          EC2_HOST="${{ secrets.EC2_HOST }}"
          echo "📋 ASPM 테스트 엔드포인트 확인:"
          for endpoint in "/" "/health" "/admin" "/docs"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}${endpoint} || echo "000")
            echo "  ${endpoint}: HTTP ${CODE}"
          done
