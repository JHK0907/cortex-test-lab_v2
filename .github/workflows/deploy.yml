name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # 배포 대상 서버 IP
  EC2_HOST: "43.203.59.65"
  # Cortex & DB 설정
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_BASE_URL: ${{ secrets.CORTEX_API_BASE_URL }}
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # ────────────────────────────────────────
  # Job 1: Cortex Code Security Scan (CLI)
  # ────────────────────────────────────────
  code-scan:
    name: Cortex Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies and Cortex CLI
        run: |
          sudo apt-get update && sudo apt-get install -y libhyperscan5
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          (echo; echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"') >> /home/runner/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap paloaltonetworks/cortexcli
          brew install cortexcli

      - name: Run Cortex Security Scans
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          REPO_ID="${{ github.repository }}"

          echo "🚀 Running Cortex Code Scan..."
          cortexcli --api-key "${{ secrets.CORTEX_API_KEY }}" \
                    --api-key-id "${{ secrets.CORTEX_API_KEY_ID }}" \
                    --api-base-url "${{ secrets.CORTEX_API_BASE_URL }}" \
                    code scan --directory . --repo-id "$REPO_ID" --upload-mode upload --soft-fail true || echo "⚠️ Code Scan failed"

          echo "🚀 Running Cortex IaC Scan..."
          cortexcli --api-key "${{ secrets.CORTEX_API_KEY }}" \
                    --api-key-id "${{ secrets.CORTEX_API_KEY_ID }}" \
                    --api-base-url "${{ secrets.CORTEX_API_BASE_URL }}" \
                    iac scan --directory terraform/ --repo-id "$REPO_ID" --upload-mode upload --soft-fail true || echo "⚠️ IaC Scan failed"

          echo "🚀 Running Cortex Secrets Scan..."
          cortexcli --api-key "${{ secrets.CORTEX_API_KEY }}" \
                    --api-key-id "${{ secrets.CORTEX_API_KEY_ID }}" \
                    --api-base-url "${{ secrets.CORTEX_API_BASE_URL }}" \
                    secrets scan --directory . --repo-id "$REPO_ID" --upload-mode upload --soft-fail true || echo "⚠️ Secrets Scan failed"

  # ────────────────────────────────────────
  # Job 2: 앱 빌드 및 테스트
  # ────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: code-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short || echo "Tests completed (some may fail intentionally)"

  # ────────────────────────────────────────
  # Job 3: EC2 배포
  # ────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [개선] SSH 접속 전 포트 열림 확인 (i/o timeout 방지)
      - name: Wait for SSH connectivity
        run: |
          echo "🔍 Checking SSH connectivity to ${{ env.EC2_HOST }}..."
          for i in {1..10}; do
            if nc -zv -w 5 ${{ env.EC2_HOST }} 22; then
              echo "✅ SSH port is open!"
              exit 0
            fi
            echo "⏳ Waiting for SSH (attempt $i/10)..."
            sleep 10
          done
          echo "❌ SSH port is still closed after 100 seconds."
          exit 1

      # [개선] 배포 및 Nginx 설정을 하나의 SSH 세션으로 통합
      - name: Deploy and Configure Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e

            # 1. 앱 디렉토리 및 소스 업데이트
            mkdir -p /home/ubuntu/app
            
            if [ -d "/home/ubuntu/app/.git" ]; then
              echo "🔄 Pulling latest changes..."
              cd /home/ubuntu/app
              git pull origin main
            else
              echo "🚀 Cloning repository..."
              rm -rf /home/ubuntu/app
              git clone https://github.com/${{ github.repository }} /home/ubuntu/app
              cd /home/ubuntu/app
            fi

            # 2. Python 의존성 설치
            pip3 install -r app/requirements.txt

            # 3. 환경변수 파일 생성
            cat > .env << ENV
            DB_HOST=cortex-test-mysql.cx8ey4wgqdia.ap-northeast-2.rds.amazonaws.com
            DB_USER=admin
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=testdb
            SECRET_KEY=mysecretkey123
            ENV

            # 4. 기존 앱 종료 및 재시작
            echo "🔄 Restarting Uvicorn..."
            pkill -f "uvicorn app.main" || true
            sleep 2
            nohup uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              --workers 2 \
              >> /home/ubuntu/app/app.log 2>&1 &

            # 5. Nginx 설정 업데이트
            echo "⚙️ Configuring Nginx..."
            sudo tee /etc/nginx/sites-available/cortex-test << 'NGINX'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            NGINX

            sudo ln -sf /etc/nginx/sites-available/cortex-test /etc/nginx/sites-enabled/cortex-test
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deployment Successful!"

  # ────────────────────────────────────────
  # Job 4: 배포 후 헬스체크
  # ────────────────────────────────────────
  healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for app startup
        run: sleep 15

      - name: Health check
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.EC2_HOST }}/health || echo "000")
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ 헬스체크 통과 (HTTP $RESPONSE)"
          else
            echo "⚠️  헬스체크 응답: HTTP $RESPONSE"
          fi

      - name: Verify endpoints
        run: |
          echo "📋 엔드포인트 확인:"
          for endpoint in "/" "/health" "/admin" "/docs"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.EC2_HOST }}${endpoint} || echo "000")
            echo "  ${endpoint}: HTTP ${CODE}"
          done
