name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ────────────────────────────────────────────
# VULNERABLE: 시크릿 평문 노출 (Code Security 탐지 대상)
# ────────────────────────────────────────────
env:
  # VULNERABLE: AWS Key 하드코딩 → Code Security 탐지 대상
  AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
  AWS_SECRET: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  DB_PASSWORD: SuperSecret1234!
  APP_SECRET_KEY: my-super-secret-jwt-key-12345

jobs:
  # ────────────────────────────────────────
  # Job 1: Code Security 스캔 (Cortex 연동)
  # ────────────────────────────────────────
  code-scan:
    name: Cortex Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Checkov IaC 취약점 스캔 (Terraform)
      - name: Run Checkov (IaC Security)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true  # 테스트용이므로 실패해도 계속 진행

      # Trivy 컨테이너/파일 취약점 스캔
      - name: Run Trivy (Secret & Vuln Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,vuln
          format: table
          exit-code: 0  # 테스트용이므로 실패해도 계속 진행

  # ────────────────────────────────────────
  # Job 2: 앱 빌드 및 테스트
  # ────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: code-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short || echo "Tests completed (some may fail intentionally)"

  # ────────────────────────────────────────
  # Job 3: EC2 배포
  # ────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH로 EC2에 직접 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e

            # 앱 디렉토리 준비
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            # Git pull (이미 클론된 경우)
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            # Python 의존성 설치
            pip3 install -r app/requirements.txt

            # 환경변수 파일 생성
            cat > /home/ubuntu/app/.env << 'ENV'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=testdb
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            ENV

            # 기존 프로세스 종료 후 재시작
            pkill -f "uvicorn app.main" || true
            sleep 2

            # Uvicorn으로 앱 실행 (백그라운드)
            nohup uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              --workers 2 \
              >> /home/ubuntu/app/app.log 2>&1 &

            echo "✅ 배포 완료 — PID: $!"

      # Nginx 설정 업데이트
      - name: Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo tee /etc/nginx/sites-available/cortex-test << 'NGINX'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            NGINX

            sudo ln -sf /etc/nginx/sites-available/cortex-test \
                        /etc/nginx/sites-enabled/cortex-test
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx 설정 완료"

  # ────────────────────────────────────────
  # Job 4: 배포 후 헬스체크
  # ────────────────────────────────────────
  healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for app startup
        run: sleep 15

      - name: Health check
        run: |
          EC2_HOST="${{ secrets.EC2_HOST }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ 헬스체크 통과 (HTTP $RESPONSE)"
          else
            echo "⚠️  헬스체크 응답: HTTP $RESPONSE (앱이 아직 시작 중일 수 있음)"
          fi

      - name: Verify vulnerable endpoints exist
        run: |
          EC2_HOST="${{ secrets.EC2_HOST }}"
          echo "📋 ASPM 테스트 엔드포인트 확인:"
          for endpoint in "/" "/health" "/admin" "/docs"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}${endpoint} || echo "000")
            echo "  ${endpoint}: HTTP ${CODE}"
          done
